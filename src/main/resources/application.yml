server:
  port: 8081

spring:
  application:
    name: service-clientes

  # ─── Base de Datos H2 (Desarrollo) ───────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:clientesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ─── RabbitMQ ─────────────────────────────────────────────────────────────
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# ─── RabbitMQ — Exchange, Colas y Routing Keys ─────────────────────────────
rabbitmq:
  exchange:
    clientes: clientes.exchange
  queue:
    cliente-registrado: cliente.registrado.queue
  routing-key:
    cliente-registrado: cliente.registrado

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: Service Clientes API
    description: REST API para gestión de clientes - Little Caesars BPM
    version: 1.0.0

# ─── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    com.littlecaesars: DEBUG
    org.springframework.amqp: WARN
